[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-guard"
version = "0.1.0"
description = "Circuit breaker for runaway loops in coding-agent sessions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "hao li" }]
keywords = ["claude-code", "coding-agents", "hooks", "circuit-breaker"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
]

[project.scripts]
loop-guard = "loop_guard.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/loop-guard"

[tool.setuptools.packages.find]
where = ["src"]
